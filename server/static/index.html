<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ohmni</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --parchment:#fefffc;--paper:#ffffff;--linen:#f9faf7;--ink:#171717;--graphite:#2c2c2c;--charcoal:#444141;
  --ash:#646464;--fog:#b4b8b4;--mist:#dee2de;--twilight:#282834;--dusk:#1f1f29;--signal:#41a1cf;--cerulean:#0081c0;
  --ok:#3f8f5a;--fault:#c2483d;
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --shadow:0 1px 1px rgba(0,0,0,.08),0 4px 5px rgba(0,0,0,.08);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;background:var(--parchment);color:var(--ink);font:400 15px/1.5 var(--sans);letter-spacing:-.01em}
h1,h2,h3{font-family:var(--serif);font-weight:400;line-height:1.1;letter-spacing:-.02em;color:var(--graphite);margin:0}
h1{font-size:48px} h2{font-size:27px}
a{color:var(--signal)}
button{font-family:var(--sans)}
.wrap{max-width:1200px;margin:0 auto;padding:16px 24px 80px}

/* nav pill */
nav.pill{position:sticky;top:16px;z-index:20;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  width:fit-content;max-width:100%;margin:0 auto 32px;padding:8px 12px 8px 24px;border-radius:50px;
  background:rgba(254,255,252,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 2px 6px rgba(0,0,0,.15)}
.logo{font:400 27px/1.1 var(--serif);letter-spacing:-.02em;color:var(--graphite);margin-right:8px}
.navfield{display:flex;align-items:center;gap:8px}

/* inputs: no radius, linen fill, bottom border only */
select,input[type=text]{font:400 15px/1.5 var(--sans);letter-spacing:-.01em;color:var(--ink);background:var(--linen);
  border:0;border-bottom:1px solid var(--mist);border-radius:0;padding:6px 8px;outline:none;max-width:220px}
input[type=text]{max-width:none}
select:focus,input[type=text]:focus{border-bottom-color:var(--twilight)}
.check{display:inline-flex;align-items:center;gap:8px;font:400 13px/1.5 var(--sans);color:var(--charcoal)}
input[type=checkbox],input[type=range]{accent-color:var(--twilight)}

/* status pill: the only place ok/fault colors appear, plus the meter edge */
.status{display:inline-flex;align-items:center;gap:8px;padding:4px 12px;border:1px solid var(--mist);border-radius:50px;
  background:var(--paper);font:500 13px/1.5 var(--sans);color:var(--charcoal);white-space:nowrap}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--fog);flex:none}
.status.ok .dot{background:var(--ok)}
.status.fault .dot{background:var(--fault)}

/* layout */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:24px;align-items:start}
.bench{grid-column:span 6;display:flex;flex-direction:column;gap:16px;min-width:0}
.side{grid-column:span 6;min-width:0}
@media (max-width:899px){.bench,.side{grid-column:span 12}}

.card{background:var(--paper);border:1px solid var(--mist);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.label{font:500 13px/1.5 var(--sans);color:var(--ash);letter-spacing:-.01em}
.helper{font:400 13px/1.5 var(--sans);color:var(--ash)}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.between{justify-content:space-between}

/* buttons: outlined, no shadows, never filled blue */
.btn{font:500 15px/1 var(--sans);letter-spacing:-.01em;padding:10px 16px;border-radius:8px;background:transparent;
  border:1px solid var(--signal);color:var(--signal);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--linen)}
.btn.secondary{border-color:var(--twilight);color:var(--charcoal)}
.btn:disabled{border-color:var(--fog);color:var(--fog);cursor:default;background:transparent}
.btn.small{font-size:13px;padding:6px 12px}

/* camera */
.cam{position:relative;border-radius:8px;overflow:hidden;background:var(--linen);aspect-ratio:4/3}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam .tag{position:absolute;top:12px;left:12px}
.cam .off{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--ash);font-size:15px}

/* meters */
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px}
.meter{border-left:3px solid var(--mist)}
.meter.ok{border-left-color:var(--ok)}
.meter.fault{border-left-color:var(--fault)}
.meter .val{font:500 48px/1.1 var(--sans);font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:var(--graphite);margin-top:4px}
.meter .val small{font-size:18px;color:var(--ash);font-weight:400}

/* sim panel */
#simpanel{display:none}
#simpanel .sl{display:grid;grid-template-columns:32px 1fr 64px auto;gap:12px;align-items:center;font-size:13px;color:var(--charcoal)}
#simpanel .sl span{font-variant-numeric:tabular-nums;text-align:right}

/* tabs */
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--mist);margin-bottom:16px}
.tab{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:8px 0;cursor:pointer;
  font:500 16px/1.5 var(--sans);letter-spacing:-.01em;color:var(--ash)}
.tab.active{color:var(--ink);border-bottom-color:var(--twilight)}
.pane{display:none;flex-direction:column;gap:16px}
.pane.active{display:flex}

/* guide */
.instr{font:400 18px/1.5 var(--sans);color:var(--ink);margin:12px 0 8px}
.hint{font-size:15px;color:var(--charcoal);min-height:22px}
#ptt{width:100%;padding:20px;border:0;border-radius:8px;background:var(--dusk);color:var(--parchment);
  font:500 18px/1.2 var(--sans);letter-spacing:-.01em;cursor:pointer;user-select:none;touch-action:none}
#ptt.live{background:var(--twilight);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.82}}
.heard{color:var(--ash);font-style:italic;min-height:22px}
.log{display:flex;flex-direction:column;gap:8px;max-height:320px;overflow:auto}
.msg{padding:12px 16px;border-radius:12px;background:var(--paper);border:1px solid var(--mist);max-width:92%;color:var(--ink)}
.msg.me{align-self:flex-end;background:var(--linen);color:var(--charcoal)}
.msg.thinking{color:var(--ash)}
.msg .lat{font-size:13px;color:var(--ash);margin-left:8px;font-variant-numeric:tabular-nums}

/* code tab */
.console{margin:8px 0 0;background:var(--linen);border-bottom:1px solid var(--mist);padding:8px 12px;height:120px;overflow:auto;
  font:400 13px/1.5 var(--mono);color:var(--charcoal);white-space:pre-wrap;word-break:break-word}

/* welcome: the one cerulean atmospheric surface */
.welcome{background:var(--cerulean);color:var(--parchment);border-radius:24px;padding:40px;display:flex;flex-direction:column;gap:16px}
.welcome h1{color:var(--parchment)}
.welcome p{margin:0;font-size:18px;max-width:460px}
.welcome .btn{border-color:var(--parchment);color:var(--parchment);align-self:flex-start}
.welcome .btn:hover{background:rgba(254,255,252,.12)}
</style>
</head>
<body>
<div class="wrap">
  <nav class="pill">
    <div class="logo">Ohmni</div>
    <select id="lab" title="Lab"></select>
    <select id="camsel" title="Camera"></select>
    <label class="check"><input type="checkbox" id="autohelp" checked> Speak up on faults</label>
    <div class="status" id="conn"><span class="dot"></span><span id="conntext">Connecting</span></div>
  </nav>

  <main class="grid">
    <section class="bench">
      <div class="card">
        <div class="cam">
          <video id="cam" autoplay playsinline muted></video>
          <div class="off" id="camoff">Camera off. Pick a camera in the bar above.</div>
          <div class="status tag">Bench camera</div>
        </div>
      </div>
      <div class="meters" id="meters"></div>
      <div class="card" id="simpanel"></div>
    </section>

    <section class="side">
      <div class="tabs" role="tablist">
        <button class="tab active" data-tab="guide" role="tab">Guide</button>
        <button class="tab" data-tab="code" role="tab">Code</button>
      </div>

      <div class="pane active" id="pane-guide">
        <div class="welcome" id="welcome">
          <h1>A TA on every bench.</h1>
          <p>Pick a lab, wire the circuit, and write the code. Ohmni reads the meter, sees the breadboard and checks your sketch together.</p>
          <button class="btn" id="start">Start the lab &rarr;</button>
        </div>
        <div class="card" id="stepcard" hidden>
          <div class="row between">
            <div class="label" id="stepn"></div>
            <div class="status" id="badge"><span class="dot"></span><span id="badgetext">Waiting</span></div>
          </div>
          <h2 id="labtitle" style="margin-top:12px"></h2>
          <div class="instr" id="instr"></div>
          <div class="hint" id="hint"></div>
          <div class="row" style="margin-top:16px">
            <button class="btn secondary" id="prev">&larr; Back</button>
            <button class="btn" id="next">Next step &rarr;</button>
          </div>
        </div>
        <button id="ptt">Hold to talk (Space or bench button)</button>
        <div class="heard" id="heard"></div>
        <input type="text" id="typed" placeholder="Or type a question and press Enter">
        <div class="log" id="log"></div>
      </div>

      <div class="pane" id="pane-code">
        <div class="card">
          <div class="row between">
            <div class="label">Target board</div>
            <div class="helper" id="instport"></div>
          </div>
          <div class="row" style="margin-top:8px">
            <select id="fqbn" title="Board"></select>
            <select id="tport" title="Target port"></select>
            <button class="btn secondary small" id="refreshports">Refresh ports</button>
          </div>
        </div>
        <div class="card">
          <div class="row between">
            <div class="label">Serial monitor</div>
            <div class="row">
              <select id="baud" title="Baud rate"></select>
              <button class="btn secondary small" id="clearserial">Clear</button>
            </div>
          </div>
          <pre class="console" id="serial"></pre>
        </div>
      </div>
    </section>
  </main>
</div>
<canvas id="snap" hidden></canvas>

<script>
const $ = s => document.querySelector(s);
let labs = {}, busy = false, seenAlert = null, lastPtt = 0, simBuilt = false;
let started = sessionStorage.getItem('ohmni-started') === '1';

async function api(path, body) {
  const r = await fetch(path, body ? {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)} : {});
  return r.json();
}
function esc(t) { return String(t).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c])); }
function setStatus(el, cls, text) { el.className = 'status ' + (cls || ''); el.querySelector('span:last-child').textContent = text; }

/* ---------- tabs ---------- */
function showTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  document.querySelectorAll('.pane').forEach(p => p.classList.toggle('active', p.id === 'pane-' + name));
  window.dispatchEvent(new Event('ohmni-tab'));
}
function showStarted() {
  $('#welcome').hidden = started; $('#stepcard').hidden = !started;
}

/* ---------- camera ---------- */
async function startCam(deviceId) {
  try {
    if (window.camStream) camStream.getTracks().forEach(t => t.stop());
    window.camStream = await navigator.mediaDevices.getUserMedia({
      video: deviceId ? {deviceId: {exact: deviceId}} : {width: {ideal: 1280}}, audio: false});
    $('#cam').srcObject = camStream;
    $('#camoff').hidden = true;
  } catch (e) { console.warn('camera unavailable', e); $('#camoff').hidden = false; }
}
async function setupCameras() {
  await startCam();
  try {
    const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
    const sel = $('#camsel'); sel.innerHTML = '';
    if (!devs.length) sel.add(new Option('No camera', ''));
    devs.forEach((d, i) => sel.add(new Option(d.label || ('Camera ' + (i + 1)), d.deviceId)));
    sel.onchange = () => startCam(sel.value);
  } catch (e) {}
}
function snap() {
  const v = $('#cam'); if (!v.videoWidth) return null;
  const w = 768, h = Math.round(v.videoHeight * w / v.videoWidth);
  const c = $('#snap'); c.width = w; c.height = h;
  c.getContext('2d').drawImage(v, 0, 0, w, h);
  return c.toDataURL('image/jpeg', 0.7).split(',')[1];
}

/* ---------- live state ---------- */
function connectWS() {
  const ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onmessage = e => render(JSON.parse(e.data));
  ws.onclose = () => setTimeout(connectWS, 1000);
}
const STATUS_TEXT = {ok: 'Looks good', fault: 'Something is off', waiting: 'Waiting'};
function render(s) {
  setStatus($('#conn'), s.connected ? 'ok' : 'fault',
    (s.connected ? (s.sim ? 'Simulated instrument' : 'Instrument connected') : 'Looking for the Uno instrument') + ' · ' + s.model);
  $('#instport').textContent = s.instrument_port ? 'Instrument (Uno): ' + s.instrument_port : 'Instrument (Uno): not found yet';
  if (s.serial && s.serial.length) appendSerial(s.serial);
  if (s.target && s.target.port !== lastTargetPort) { lastTargetPort = s.target.port; loadPorts(); }
  const lab = labs[s.lab]; if (!lab) return;
  if ($('#lab').value !== s.lab) $('#lab').value = s.lab;

  const edge = s.status === 'waiting' ? '' : s.status;
  $('#meters').innerHTML = Object.entries(lab.probes).map(([k, name]) => {
    const mv = s.v[+k.slice(1) - 1];
    return `<div class="card meter ${edge}"><div class="label">${k} · ${esc(name)}</div><div class="val">${(mv / 1000).toFixed(2)}<small> V</small></div></div>`;
  }).join('');

  const st = lab.steps[s.step];
  $('#stepn').textContent = `Step ${s.step + 1} of ${lab.steps.length}`;
  $('#labtitle').textContent = lab.title;
  $('#instr').textContent = st.instruction;
  setStatus($('#badge'), s.thinking ? '' : edge, s.thinking ? 'Thinking' : STATUS_TEXT[s.status]);
  $('#hint').textContent = s.hint || '';

  // bench push-to-talk button
  if (s.ptt && !lastPtt) pttDown();
  if (!s.ptt && lastPtt) pttUp();
  lastPtt = s.ptt;

  // proactive help when something breaks
  if (seenAlert === null) seenAlert = s.alert_id;
  else if (s.alert_id !== seenAlert) {
    seenAlert = s.alert_id;
    if ($('#autohelp').checked && started) ask('', true);
  }

  if (s.sim && !simBuilt) buildSim(s.v);
}

/* ---------- voice ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, heard = '', live = false;
function pttDown() {
  if (live) return; live = true; heard = '';
  speechSynthesis.cancel();
  $('#ptt').classList.add('live'); $('#ptt').textContent = 'Listening. Release to ask';
  $('#heard').textContent = '';
  if (!SR) { $('#heard').textContent = 'Voice needs Chrome. Type below instead.'; return; }
  rec = new SR(); rec.lang = 'en-US'; rec.continuous = true; rec.interimResults = true;
  rec.onresult = e => { heard = Array.from(e.results).map(r => r[0].transcript).join(' '); $('#heard').textContent = heard; };
  rec.onend = () => { const t = heard.trim(); rec = null; if (t) ask(t, false); };
  rec.start();
}
function pttUp() {
  if (!live) return; live = false;
  $('#ptt').classList.remove('live'); $('#ptt').textContent = 'Hold to talk (Space or bench button)';
  if (rec) rec.stop();
}
function speak(t) {
  const u = new SpeechSynthesisUtterance(t); u.rate = 1.05;
  speechSynthesis.speak(u);
}

/* ---------- asking Gemma ---------- */
function addMsg(text, cls) {
  const d = document.createElement('div'); d.className = 'msg ' + cls; d.textContent = text;
  $('#log').appendChild(d); $('#log').scrollTop = 1e9; return d;
}
async function ask(text, auto) {
  if (busy) return; busy = true;
  addMsg(auto ? 'Ohmni noticed something on the meter' : text, 'me');
  const pending = addMsg('Looking at your bench', 'thinking');
  try {
    const r = await api('/api/ask', {text, auto, image: snap()});
    pending.textContent = r.reply; pending.className = 'msg';
    const lat = document.createElement('span'); lat.className = 'lat'; lat.textContent = r.latency + ' s';
    pending.appendChild(lat);
    speak(r.reply);
  } catch (e) {
    pending.textContent = 'Error: ' + e; pending.className = 'msg';
  } finally { busy = false; }
}

/* ---------- sim sliders (SIM=1 only) ---------- */
function buildSim(v) {
  simBuilt = true;
  const p = $('#simpanel'); p.style.display = 'block';
  p.innerHTML = '<div class="label" style="margin-bottom:8px">Simulated probes, mV (SIM=1)</div>' +
    [0, 1, 2, 3].map(i => `<div class="sl">P${i + 1}<input type="range" min="0" max="5000" step="10" value="${v[i]}" data-i="${i}"><span id="sv${i}">${v[i]}</span><span></span></div>`).join('') +
    '<label class="check" style="margin-top:8px"><input type="checkbox" id="simptt"> Bench button held</label>';
  const push = () => {
    const vals = [...p.querySelectorAll('input[type=range]')].map(r => { $('#sv' + r.dataset.i).textContent = r.value; return +r.value; });
    api('/api/sim', {v: vals, ptt: $('#simptt').checked ? 1 : 0});
  };
  p.querySelectorAll('input').forEach(el => el.oninput = push);
}

/* ---------- target board + serial monitor ---------- */
let lastTargetPort, portsInit = false;
async function loadPorts() {
  const r = await api('/api/ports');
  const fq = $('#fqbn'), tp = $('#tport'), bd = $('#baud');
  if (!portsInit) {
    portsInit = true;
    for (const [id, name] of Object.entries(r.fqbns)) fq.add(new Option(name, id));
    for (const b of r.bauds) bd.add(new Option(b + ' baud', b));
    fq.onchange = () => api('/api/target', {fqbn: fq.value});
    bd.onchange = () => api('/api/target', {baud: +bd.value});
    tp.onchange = async () => {
      const res = await api('/api/target', {port: tp.value});
      if (res.error) { appendSerial(['[ohmni] ' + res.error]); loadPorts(); }
    };
  }
  fq.value = r.target.fqbn; bd.value = r.target.baud;
  tp.innerHTML = '';
  tp.add(new Option('Pick the target port', ''));
  for (const p of r.ports) {
    const o = new Option(p.device + (p.role === 'instrument' ? ' (Ohmni instrument)' : p.description ? ' (' + p.description + ')' : ''), p.device);
    o.disabled = p.role === 'instrument';
    tp.add(o);
  }
  tp.value = r.target.port || '';
}
function appendSerial(lines) {
  const el = $('#serial');
  const stick = el.scrollTop + el.clientHeight >= el.scrollHeight - 8;
  el.textContent += lines.join('\n') + '\n';
  if (el.textContent.length > 20000) el.textContent = el.textContent.slice(-15000);
  if (stick) el.scrollTop = el.scrollHeight;
}

/* ---------- wiring up ---------- */
async function init() {
  labs = await api('/api/labs');
  const sel = $('#lab');
  for (const [id, l] of Object.entries(labs)) sel.add(new Option(l.title, id));
  sel.onchange = () => { api('/api/lab', {lab: sel.value}); $('#log').innerHTML = ''; start(); };
  $('#next').onclick = () => api('/api/step', {delta: 1});
  $('#prev').onclick = () => api('/api/step', {delta: -1});
  $('#start').onclick = start;
  document.querySelectorAll('.tab').forEach(t => t.onclick = () => showTab(t.dataset.tab));
  showStarted();

  const ptt = $('#ptt');
  ptt.onpointerdown = pttDown; ptt.onpointerup = pttUp; ptt.onpointerleave = pttUp;
  const typing = () => ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName) || document.activeElement.closest('.monaco-editor');
  document.addEventListener('keydown', e => {
    if (e.code === 'Space' && !e.repeat && !typing()) { e.preventDefault(); pttDown(); }
  });
  document.addEventListener('keyup', e => {
    if (e.code === 'Space' && !typing()) { e.preventDefault(); pttUp(); }
  });
  $('#typed').addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.value.trim()) { ask(e.target.value.trim(), false); e.target.value = ''; }
  });

  $('#refreshports').onclick = loadPorts;
  $('#clearserial').onclick = () => { $('#serial').textContent = ''; };
  await loadPorts();
  connectWS();
  setupCameras();
}
function start() { started = true; sessionStorage.setItem('ohmni-started', '1'); showStarted(); }
init();
</script>
</body>
</html>
